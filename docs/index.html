<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satellite Ecological Analysis Platform</title>
    <style>
      :root { font-family: Inter, system-ui, Arial, sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #172033; }
      header { background: #172033; color: white; padding: 1rem 1.2rem; }
      main { max-width: 1100px; margin: 1rem auto; padding: 0 1rem; }
      .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
      .card { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
      label { font-weight: 600; display: block; margin-top: .75rem; }
      input, select, textarea, button { width: 100%; padding: .55rem; margin-top: .35rem; border-radius: 8px; border: 1px solid #cbd4e6; box-sizing: border-box; }
      button { background: #1f6feb; color: white; border: none; font-weight: 600; cursor: pointer; margin-top: 1rem; }
      .kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: .75rem; margin-bottom: .75rem; }
      .kpi { background:#f3f7ff; border:1px solid #d7e3ff; border-radius:10px; padding:.6rem; }
      .kpi h4{margin:.1rem 0; font-size:.8rem; color:#355}
      .kpi p{margin:.2rem 0; font-size:1.1rem; font-weight:700}
      pre { white-space: pre-wrap; }
      .muted { color: #5f6d89; font-size: .9rem; }
      @media (max-width: 900px){ .layout{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(2,1fr);} }
    </style>
  </head>
  <body>
    <header><h2>Satellite Ecological Analysis Platform (GitHub Pages UI)</h2></header>
    <main class="layout">
      <section class="card">
        <h3>Inputs</h3>
        <p class="muted">Set your API URL to your deployed FastAPI backend.</p>
        <label>API Base URL</label>
        <input id="apiBase" placeholder="https://your-api.example.com" />

        <label>Input Type</label>
        <select id="inputType">
          <option value="coordinates">coordinates</option>
          <option value="place_name">place_name</option>
        </select>

        <label>Latitude</label>
        <input id="lat" type="number" step="0.000001" value="-1.286389" />

        <label>Longitude</label>
        <input id="lon" type="number" step="0.000001" value="36.817223" />

        <label>Place Name (optional)</label>
        <input id="place" type="text" placeholder="Nairobi" />

        <button id="runBtn">Run Analysis</button>
      </section>

      <section class="card">
        <h3>Results</h3>
        <div id="status" class="muted">No analysis run yet.</div>
        <div class="kpis" id="kpis"></div>

        <h4>Land Cover</h4>
        <pre id="landCover">-</pre>

        <h4>Interpretation</h4>
        <pre id="interpretation">-</pre>
      </section>
    </main>

    <script>
      const apiBaseInput = document.getElementById('apiBase');
      const qApiBase = new URLSearchParams(window.location.search).get('apiBase');
      const defaultApi = qApiBase || localStorage.getItem('apiBase') || 'http://localhost:8000';
      apiBaseInput.value = defaultApi;

      function setStatus(message, isError = false) {
        const el = document.getElementById('status');
        el.textContent = message;
        el.style.color = isError ? '#b00020' : '#5f6d89';
      }

      function setKpis(metrics) {
        const kpis = document.getElementById('kpis');
        if (!metrics) { kpis.innerHTML = ''; return; }
        kpis.innerHTML = [
          ['NDVI', metrics.ndvi],
          ['EVI', metrics.evi],
          ['NDMI', metrics.ndmi],
          ['Biomass', `${metrics.biomass_score.toFixed(2)} (${metrics.biomass_category})`],
        ].map(([k,v]) => `<div class="kpi"><h4>${k}</h4><p>${typeof v === 'number' ? v.toFixed(2) : v}</p></div>`).join('');
      }

      document.getElementById('runBtn').addEventListener('click', async () => {
        const apiBase = apiBaseInput.value.replace(/\/$/, '');
        localStorage.setItem('apiBase', apiBase);

        const payload = {
          input_type: document.getElementById('inputType').value,
          latitude: Number(document.getElementById('lat').value),
          longitude: Number(document.getElementById('lon').value),
          location_query: document.getElementById('place').value || null,
        };

        setStatus('Running analysis...');
        setKpis(null);

        try {
          const response = await fetch(`${apiBase}/analysis/run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            throw new Error(await response.text());
          }

          const data = await response.json();
          setStatus(`Completed: ${data.analysis_id}`);
          setKpis(data.metrics);
          document.getElementById('landCover').textContent = JSON.stringify(data.metrics.land_cover, null, 2);
          document.getElementById('interpretation').textContent = data.interpretation || '-';
        } catch (error) {
          setStatus(`Request failed. Check API URL and CORS. ${error}`, true);
        }
      });
    </script>
  </body>
</html>
